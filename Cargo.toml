[package]
name = "deribit-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "MCP (Model Context Protocol) server for Deribit trading platform"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/deribit-mcp"
homepage = "https://github.com/joaquinbejar/deribit-mcp"
keywords = ["finance", "deribit", "trading", "mcp", "api"]
categories = ["finance", "api-bindings"]

include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "deribit_mcp"
path = "src/lib.rs"

[[bin]]
name = "deribit-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK — pinned to a specific minor.
rmcp = { version = "1.6", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }

# Async runtime.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "io-std",
    "sync",
    "time",
] }

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Serialization + schema.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the same major as the version `rmcp` re-exports
# (`rmcp::schemars`) so tool input structs deriving `JsonSchema`
# interoperate with `Tool::with_input_schema::<T>()` without two-major
# linkage in the dependency graph.
schemars = "1"

# Errors.
thiserror = "2"

# CLI + config.
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# Binary main only — bubbles up startup failures to a printed exit message.
anyhow = "1"

# URL parsing — shared with the upstream `deribit-http` and
# `deribit-websocket` crates so endpoint round-tripping uses the same
# parser semantics.
url = "2"

# HTTP server (transport=http branch). axum + tower wrap rmcp's
# `StreamableHttpService` and add `/healthz` plus the optional
# `DERIBIT_HTTP_BEARER_TOKEN` middleware (env-only per ADR-0004).
axum = "0.8"
tower = "0.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Stream + future combinators for the live resource registry
# (`futures_util::StreamExt::next` on the upstream channel reader,
# `futures_core::Stream` as the public stream type).
futures-core = "0.3"
futures-util = "0.3"

# Sibling Deribit Rust family. Auth, rate limiting, reconnect, wire codecs all
# live upstream — this crate is a thin adapter (ADR-0001).
deribit-base = "0.3"
deribit-http = { version = "0.7", default-features = false, features = ["native"] }
# Declared for v0.1; live resources land in v0.3 (ADR-0006).
deribit-websocket = { version = "0.3", default-features = false, features = ["rustls-aws-lc"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# `async_stream::stream!` for unit-test stub providers that need
# to interleave a `Notify` with a fixed sequence of items.
async-stream = "0.3"
# WebSocket server-side for the v0.3-06 mock used by the live-resource
# integration tests. Pinned to the same major as the version
# `deribit-websocket` already pulls in so the test binary doesn't add
# a second copy.
tokio-tungstenite = "0.29"
# Snapshot review for tool input-schemas and `AdapterError` wire shape.
# Snapshots are committed under `tests/snapshots/` and reviewed
# deliberately on every PR.
insta = { version = "1", features = ["yaml", "redactions"] }
# Mock HTTP server for integration tests against `deribit-http`.
# Used in `tests/integration.rs` to exercise tool / resource handlers
# end to end without hitting the live testnet.
mockito = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
